name: linux-full-sequence

on:
  workflow_dispatch:

jobs:
  cpp-full-tum-fr1-xyz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libeigen3-dev libopencv-dev curl
      - name: Download official TUM fr1/xyz
        run: |
          mkdir -p data artifacts/linux_cpp_full
          curl --fail --location --retry 3 \
            https://cvg.cit.tum.de/rgbd/dataset/freiburg1/rgbd_dataset_freiburg1_xyz.tgz \
            --output /tmp/rgbd_dataset_freiburg1_xyz.tgz
          sha256sum /tmp/rgbd_dataset_freiburg1_xyz.tgz \
            | tee artifacts/linux_cpp_full/dataset_archive_sha256.txt
          tar -xzf /tmp/rgbd_dataset_freiburg1_xyz.tgz -C data
      - name: Build, test, and run all one-to-one associated frames
        run: |
          bash scripts/build_and_run_cpp.sh \
            data/rgbd_dataset_freiburg1_xyz \
            artifacts/linux_cpp_full
      - name: Record runner environment
        run: |
          {
            uname -a
            g++ --version
            cmake --version
            pkg-config --modversion opencv4
          } > artifacts/linux_cpp_full/runner_environment.txt
      - name: Upload Linux evidence only
        uses: actions/upload-artifact@v4
        with:
          name: linux-cpp-tum-fr1-xyz-results
          path: artifacts/linux_cpp_full
          if-no-files-found: error
          retention-days: 30
