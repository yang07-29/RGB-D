name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Run unit tests
        run: python -m pytest tests -q

  cpp-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libopencv-dev
      - name: Configure
        run: cmake -S cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpp --parallel
      - name: Run C++ tests
        run: ctest --test-dir build/cpp --output-on-failure

  ros2-cpp-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS2 C++ build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions ninja-build libeigen3-dev libopencv-dev \
            ros-jazzy-ament-cmake-python ros-jazzy-cv-bridge \
            ros-jazzy-message-filters ros-jazzy-tf2-ros
      - name: Build ROS2 C++ node
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base log/ros2 build \
            --base-paths ros2_ws/src \
            --build-base build/ros2 \
            --install-base install/ros2 \
            --packages-select rgbd_odometry_ros \
            --cmake-args -DRGBD_ROS_BUILD_CPP=ON -DCMAKE_BUILD_TYPE=Release -G Ninja
      - name: Run embedded C++ tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base log/ros2-test test \
            --build-base build/ros2 \
            --install-base install/ros2 \
            --packages-select rgbd_odometry_ros \
            --event-handlers console_direct+
          colcon test-result --test-result-base build/ros2 --verbose
